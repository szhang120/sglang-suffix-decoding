name: Native cache and integration contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Reconstruct pinned checkouts and patch
        run: bash scripts/bootstrap.sh
      - name: Build author suffix module and run host checks
        run: bash scripts/build_native.sh
      - name: Verify already-applied patch and Python syntax
        run: |
          git -C sglang apply --reverse --check ../patches/sglang-suffix.patch
          python -m compileall -q scripts tests native/suffix_native
          python - <<'PY'
          import py_compile
          from pathlib import Path
          for line in Path("patches/sglang-suffix.patch").read_text().splitlines():
              if line.startswith("diff --git "):
                  path = Path("sglang") / line.split(" b/", 1)[1]
                  if path.suffix == ".py":
                      py_compile.compile(str(path), doraise=True)
          PY
